name: Bot Seguimiento de Noticias

on:
  schedule:
    # Se ejecuta cada 2 horas (puedes ajustar el cron como prefieras)
    # Formato: min hora dia mes dia_semana
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Necesitamos permisos de escritura para hacer commit del historial
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el bot de noticias
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Guardar historial (Commit de historial.txt)
        # Esto guarda el historial para que en la próxima ejecución no se repitan noticias
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historial.txt || true
          git commit -m "Actualizar historial de noticias [skip ci]" || echo "No hay cambios en el historial"
          git push
